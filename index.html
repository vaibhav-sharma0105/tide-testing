<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(l){
        if(l.search[1]==='/'){
          var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')});
          window.history.replaceState(null,null,l.pathname.slice(0,-1)+d[0]+(d[1]?'?'+d[1]:'')+l.hash);
        }
      }(window.location));
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/shared/tide-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://padlet.com https://www.youtube.com https://docs.google.com https://drive.google.com https://script.google.com https://forms.gle; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://fonts.googleapis.com https://fonts.gstatic.com;" />
    <!-- title/description/canonical/OG/Twitter are intentionally NOT set
         here — every page sets its own correct, specific values via
         SeoHead (src/components/ui/SeoHead.jsx) + react-helmet-async.
         A static fallback here would coexist in the DOM alongside the
         per-page Helmet tag rather than being replaced by it (confirmed by
         direct testing 2026-06-22: querySelector returned the STATIC tag,
         not the per-page one, on every route, since duplicates aren't
         deduplicated across the static/Helmet boundary) -- so a "fallback"
         here would in practice silently override every single page's real
         metadata with this one generic blurb. -->
    <!-- The page title and og:site_name are filled from site.yaml `name` by scripts/siteDataPlugin.js -->
    <title></title>
    <meta name="theme-color" content="#1E6BAA" />
    <meta property="og:site_name" content="" />
    <!-- Google Fonts: Plus Jakarta Sans + Playfair Display + Noto scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Caveat:wght@600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@300;400;500;600;700&family=Noto+Serif+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- JSON-LD structured data (NGO + WebSite): generated at build/dev time
         from content/shared/site.yaml by scripts/siteDataPlugin.js. Do not
         hand-write it here — edit site.yaml instead. -->
    <!-- site-jsonld -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
