meta:
  badge: "Resources · ABL"
  # The banner leads with the programme name; the descriptor beneath keeps "ABL Resource Library".
  title: "Pramaan"
  descriptor: "ABL Resource Library"
  subtitle: "A curated library of Activity-Based Learning resources for Grades {gradeRange}, developed and used by TIDE Foundation educators."
  seoTitle: "Pramaan — ABL Resource Library — TIDE Foundation"
  seoDescription: "Browse Activity-Based Learning resources for Grades {gradeRange} developed by TIDE Foundation educators."
  # Last crumb in the SEO breadcrumb trail (Home > ... > this page)
  breadcrumbName: "Pramaan"

# Tab bar shown on all Pramaan pages (About / Resource Centre / Contribute)
nav:
  home: "About Pramaan"
  resourceCenter: "Resource Centre"
  contribute: "Contribute"

stats:
  totalResources: "Total Resources"
  resourceTypes: "Resource Types"
  gradeCovered: "Grades Covered"
  gradeRange: "{gradeRange}"
  # Shown as a small freshness line under the three stats: "Updated 2 Nov 2026"
  lastSynced: "Updated"

about:
  badge: "About ABL"
  title: "What is Activity-Based Learning?"
  body: "Activity-Based Learning (ABL) is a child-centred pedagogical approach in which students learn by doing — through games, worksheets, manipulatives, and hands-on activities — rather than passive instruction. TIDE Foundation has developed a rich library of ABL materials for Grades {gradeRange} across multiple subjects and languages. Over the years, the materials have reached 120+ schools and 25,000+ learners. During these programs, we have continued developing new resources and refining them."
  # The reach figures from the text above, shown as counters (keep the two in step).
  reach:
    - value: "120+"
      label: "schools"
    - value: "25,000+"
      label: "learners"
  # Words underlined in the first sentence.
  highlights: ["learn by doing"]
  browseButton: "Browse All Resources"
  whyTitle: "Why ABL Works"
  whyPoints:
    - "Engages all learning styles — visual, kinesthetic, and auditory"
    - "Improves concept retention through hands-on practice"
    - "Adaptable to mixed-ability classrooms"
    - "Designed for Gujarati, Hindi, and English medium schools"

# Promo video in the blue banner. The player loads only when the visitor presses play.
promo:
  youtubeId: "12Kzj8bgTQA"
  title: "Pramaan promo video"
  playLabel: "Play the Pramaan promo video"
  # Text on the drawn poster. Every claim here comes from the page's own text (the reach figures);
  # keep it true if the figures change.
  posterTitle: "Learning by doing."
  posterSub: "Reached 25,000+ learners in 120+ schools."
  playText: "Watch the video"

# Photo strip: drifts by itself, stops on hover, and can be scrolled or stepped with the arrows.
# PLACEHOLDER photos taken from the site's existing images (people, not objects) until real ABL
# session photos are added; the alt text should describe each photo.
gallery:
  title: "Hands-on learning, caught in action"
  subtitle: "Photos from our past ABL sessions and of the materials in use"
  prevLabel: "Previous photos"
  nextLabel: "Next photos"
  items:
    - src: "/assets/images/projects-bettered/gallery-01.jpg"
      alt: "A volunteer leads a blindfolded group game for children in a courtyard"
    - src: "/assets/images/projects-bettered/gallery-05.jpg"
      alt: "Students writing on worksheets during a session"
    - src: "/assets/images/get-involved-volunteer/gallery-03.jpg"
      alt: "Children and volunteers cheering together outdoors"
    - src: "/assets/images/projects-bettered/gallery-04.jpg"
      alt: "Children and volunteers working together on a floor-based activity"
    - src: "/assets/images/projects-bettered/gallery-09.jpg"
      alt: "A group of children holding oranges after a session"
    - src: "/assets/images/get-involved-volunteer/gallery-02.jpg"
      alt: "Volunteers sitting on steps with children, mid-conversation"
    - src: "/assets/images/projects-bettered/gallery-08.jpg"
      alt: "A facilitator talking with a group of children in a courtyard"
    - src: "/assets/images/projects-bettered/gallery-07.jpg"
      alt: "Children seated on mats in a lane for a group activity"
    - src: "/assets/images/get-involved-volunteer/gallery-05.jpg"
      alt: "Volunteers and children smiling together for a photo"
    - src: "/assets/images/projects-bettered/gallery-03.jpg"
      alt: "Smiling children gathered outdoors after a session"

resourceTypes:
  badge: "Browse by Type"
  title: "Explore Resource Types"
  resourcesCount: "resources"
  # Display names per resource type. Keys are the Google Sheet tab names;
  # _default is used for any tab not listed. label = singular (badges),
  # pluralLabel = type cards and the Resource Centre filter list.
  # (Badge colours live in src/config/abl.js, not here.)
  labels:
    Worksheet:
      label: "Worksheet"
      pluralLabel: "Worksheets"
    Games:
      label: "Game"
      pluralLabel: "Games"
    Kits:
      label: "Kit"
      pluralLabel: "Kits"
    Flashcards:
      label: "Flashcard"
      pluralLabel: "Flashcards"
    _default:
      label: "Resource"
      pluralLabel: "Resources"

# Messages shown when the resource data cannot be loaded (used by every Pramaan page)
errors:
  notConfigured: "API not configured. Add VITE_ABL_API_URL to your .env.development file."
  timeout: "Request timed out. Please check your connection and try again."
  generic: "Failed to load resources. Please try again."
