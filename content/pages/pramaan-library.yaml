# Pramaan Library — the resource page fed by the form-format Sheet
# ("Contributing to Pramaan; Educators' Resource Bank (Responses)").
# Routes: /pramaan/resource-centre (list) and /pramaan/resource-centre/<id> (one resource) — the
# Pramaan Resource Centre. The former address /pramaan-library redirects there.
# The resources themselves come from the Sheet (src/data/sheets/pramaan-library.json, written by
# the sync); only the text around them lives here.

# Badge, titles and back label are the former Resource Centre's (owner decision, 2026-11-19).
meta:
  badge: "Resources · ABL"
  title: "Resource Centre"
  subtitle: "Browse all Activity-Based Learning resources. Filter by subject, type, grade and owner."
  seoTitle: "Resource Centre — Pramaan — TIDE Foundation"
  seoDescription: "Browse free Activity-Based Learning resources for Grades {gradeRange} — worksheets, games, kits and flashcards, filterable by subject, type, grade and owner."
  # Shown when nothing has been published yet (no row has all three consent answers "Yes")
  emptyTitle: "No resources published yet"
  emptyHint: "Resources appear here once they are approved for sharing in the Pramaan Sheet."
  lastUpdatedTemplate: "Last updated {date}"
  # Last crumb in the SEO breadcrumb trail (Home > Pramaan > this page)
  breadcrumbName: "Resource Centre"

page:
  filtersButton: "Filters"
  closeFiltersLabel: "Close filters"
  # Button at the bottom of the phone filter panel; closes it to show the results.
  showResultsTemplate: "Show {n} {resources}"
  resourceSingular: "resource"
  resourcePlural: "resources"
  showing: "Showing"
  of: "of"

filters:
  heading: "Filters"
  clear: "Clear"
  removeTemplate: "Remove filter: {name}"
  searchPlaceholder: "Search by name, concept or description…"
  searchLabel: "Search resources"
  clearSearchLabel: "Clear search"
  subjectTitle: "Subject"
  allSubjects: "All subjects"
  typeTitle: "Type of material"
  allTypes: "All types"
  gradesTitle: "Grades"
  gradeTemplate: "Grade {n}"
  foundational: "Foundational"
  ownershipTitle: "Ownership"
  allOwners: "All owners"
  # Screen-reader text for each choice in the Subject / Ownership pickers.
  optionCountTemplate: "{name}, {n} resources"

# "Sort by" menu above the results. The keys (subject, type, owner) are fixed in code;
# change only the text after the colon.
sort:
  label: "Sort by"
  options:
    subject: "Subject"
    type: "Type of material"
    owner: "Ownership"
  # The button next to the menu flips the order of the chosen field.
  ascending: "A → Z"
  descending: "Z → A"
  directionLabelTemplate: "Sort order: {dir}. Click to reverse."

grid:
  noResults: "No resources match your filters"
  noResultsHint: "Try adjusting or clearing your filters"

card:
  viewTemplate: "View {name}"
  videoAvailable: "Video available"
  imageAltFallback: "Resource"
  ownedBy: "Owned by"
  moreGradesTemplate: "+{n} more"

detail:
  backLabel: "Back to Resource Centre"
  titleTemplate: "{name} — TIDE Pramaan"
  notFoundSeoTitle: "Resource Not Found — TIDE Pramaan"
  notFoundHeading: "Resource Not Found"
  notFoundTemplate: "No resource found with ID \"{id}\"."
  subject: "Subject"
  owner: "Owned by"
  concept: "Concept"
  about: "About this resource"
  explanationVideo: "Explanation video"
  playVideoLabel: "Play explanation video"
  openVideo: "Watch video"
  openFile: "Open the file"
  additionalInfo: "More links and information"
  viewFullImageLabel: "View full image"
  viewLarger: "Tap to view larger"
  videoLogo: "assets/images/shared/tide-logo.png"
  coverageTitle: "Curricular alignment (NCERT chapters)"
  coverageHint: "Tap a grade to see its chapters."
  shortGradeTemplate: "G{n}"
  shortFoundational: "Fdn"
  chapterSeparator: " — "

# Page-number bar under the resource cards
pagination:
  ariaLabel: "Pagination"
  showing: "Showing"
  of: "of"
  resources: "resources"
  previousLabel: "Previous"
  previousShort: "Prev"
  next: "Next"
