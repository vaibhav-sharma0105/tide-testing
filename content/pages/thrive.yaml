researchAreas:
  sectionBadge: "Research"
  sectionTitle: "Current Research Areas"
  navLabel: "Jump to a research area"
  items:
    - title: "Systemic influences of teacher agency, wellbeing, and capability"
      overview: "Examining teachers' (and teachers with disabilities) agency, wellbeing, professional development, and work environments as a catalyst for educational change across India."
      photo: "/assets/images/projects-bettered/gallery-04.jpg"
      paragraphs:
        - "Teachers are central to educational change, yet their ability to shape learning and education communities is deeply influenced by the environments in which they work. This programme explores teachers as professionals, reflective practitioners, and agents of change within complex education systems."
        - "Our research examines how teachers experience and exercise agency, and how agency is shaped by professional capability, wellbeing, working conditions, leadership, institutional structures, policy, and relationships with colleagues and communities. Through mixed-methods and participatory approaches, we work alongside teachers to understand their lived experiences and the realities of their professional practice. Our work includes research on teacher agency in government schools in Bihar, as well as research foregrounding the experiences of teachers with disabilities and the barriers and enabling conditions they encounter within education systems."
    - title: "Systems transformation for socioemotional learning and mental health"
      overview: "Exploring teacher and student experiences of large scale social-emotional curricula, whole school approaches, and systematic changes."
      photo: "/assets/images/thrive/research-happiness-curriculum.png"
      paragraphs:
        - "Socioemotional learning and mental health are increasingly recognised as central to educational quality, yet initiatives are often introduced as stand-alone programmes alongside an already crowded curriculum. Our research examines how social and emotional learning and wellbeing is understood, practiced, and scaled through the wider ecology of schooling."
        - "We explore how students, teachers, school leaders, and other stakeholders experience large-scale social-emotional curricula and whole-school approaches, and how these initiatives interact with existing pedagogies, relationships, institutional cultures, and education systems. Our work includes research on Delhi's Happiness Curriculum, children's own understandings of happiness and wellbeing, and a national landscape study. We are particularly interested in the processes through which systemic change occurs: how interventions influence school environments; how changes in school environments shape students' and teachers' experiences; and what enables or constrains adoption, implementation, and sustainability."
    - title: "Education for harmony- philosophy and practices"
      overview: "Exploring philosophy, practices, processes for transformative education for self and social transformation."
      photo: "/assets/images/thrive/research-scf.jpg"
      paragraphs:
        - "Education has the potential to transform not only what people know, but how they understand themselves, relate to others, and participate in the world. This programme explores education as a process of transformation—one that can cultivate greater awareness, connectedness, responsibility, and harmony within individuals, communities, and the wider living world."
        - "Our work draws on philosophical traditions, educational thought, and practices that challenge fragmented understandings of learning and human development. We explore how education can nurture the whole person: integrating intellectual, emotional, relational, ethical, ecological, and social dimensions of development. Through empirical research and practitioner-led inquiry, we examine how transformative educational processes unfold in classrooms and communities. This includes studying reflective and contemplative pedagogies, social changemaking, children's relationships with self, others and society, and educational practices that seek to cultivate responsibility and collective flourishing."
    - title: "Higher education and Inclusive Learning"
      overview: "Examining how higher education institutions, their structures, cultures, and everyday practices can be reimagined to be inclusive and transformative."
      photo: "/assets/images/thrive/research-mcc.png"
      paragraphs:
        - "Higher education institutions are more than sites of specialised instruction; they are living systems whose pedagogies, cultures, and everyday practices shape the well-being and learning landscapes of students and faculty. Higher education institutions, understood as sites of specialisation, often treat well-being and intellectual growth as individual responsibilities, layered onto institutions whose underlying practices - what counts as knowledge, how is knowledge conveyed, how emotional life is integrated into holistic well being - remain unexamined. This programme engages with the ways in which teaching approaches, social-emotional learning, mental health support, and the wider cultures of knowledge-making within higher education institutions enable or constrain flourishing across university communities."
        - "We explore how knowledge, learning and teaching are understood and experienced differently by different stakeholders and how these experiences are shaped by classroom practice, institutional cultures, and the values embedded in what knowledge is and how knowledge is taught. Through mixed-methods, critical frameworks and participatory approaches, we work alongside institutions to understand how pedagogical and systemic change unfold in practice, and what enables it to be sustained over time."
