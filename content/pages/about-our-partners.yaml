# /about/our-partners — the text around the partner list.
# The partners themselves (names, types, priorities, websites, logos) come from the Google Sheet
# "TIDE/THRIvE Partners (Responses)" through the sync (src/data/sheets/partners.json) — edit them in
# the Sheet / Form, not here. Rules: docs/PARTNERS-SHEET-SCHEMA.md.
# {tokens} in curly brackets are filled in by the page — keep them.

meta:
  breadcrumbName: "Our Partners"
  badge: "About TIDE"
  title: "Our Partners"
  subtitle: "A network of schools, universities, organisations and funders that make our work possible."
  seoTitle: "Our Partners — TIDE Foundation"
  seoDescription: "The schools, universities, NGOs, funders and volunteer partners working with TIDE Foundation."
  # Figures under the title, counted from the partner list. {n} = the number. Hidden while the list is empty.
  stats:
    partners: "{n} partners"
    partnersOne: "{n} partner"
    groups: "{n} types of partnership"
    groupsOne: "{n} type of partnership"

directory:
  # Read by screen readers for the row of section links above the partner list.
  jumpLabel: "Jump to a type of partner"
  searchLabel: "Search partners by name"
  searchPlaceholder: "Search partners by name"
  clearSearch: "Clear search"
  # Shown while searching. {count} = partners found, {total} = all partners.
  resultCount: "{count} of {total} partners match"
  resultCountOne: "1 of {total} partners matches"
  noMatch: "No partner name matches “{query}”."
  noMatchClear: "Clear search"
  # Shown when no partner has been published yet.
  empty: "Our partner list is being updated. Please check back soon."
  # Under each section heading. {count} = partners in that section.
  sectionCount: "{count} partners"
  sectionCountOne: "1 partner"
  # Read by screen readers after a partner name that links to its website.
  opensInNewTab: "(opens in a new tab)"
  # Slider buttons (read by screen readers). {group} = the section name, e.g. "Collaborators".
  slider:
    previous: "Previous {group} partners"
    next: "Next {group} partners"
    pause: "Pause the {group} slider"
    play: "Play the {group} slider"
    listLabel: "{group} partners"
    # Between the previous and next buttons: which cards are on screen, e.g. "1–5 of 23".
    position: "{from}–{to} of {total}"
  # Phones: the button that opens the search, and the one that closes it (read by screen readers).
  searchOpen: "Search partners"
  searchClose: "Close search"

# The band at the bottom of the page. Buttons go to pages on this site (paths starting with /).
cta:
  title: "Work with TIDE"
  subtitle: "Schools, universities, organisations and volunteers partner with us in different ways. Find yours, and help us change the way children learn."
  primary:
    label: "Get in touch"
    to: "/contact"
  secondary:
    label: "Volunteer with us"
    to: "/get-involved/volunteer"
