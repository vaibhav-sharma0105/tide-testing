# TIDE Publications — /tide/publications
# The publications themselves come from the "TIDE THRIvE Publications" Sheet (rows answered
# "TIDE"), via the sync into src/data/sheets/publications.json. Only the text around them lives
# here. The THRIvE page (/thrive/publications) is in thrive-publications.yaml.
# Text in {curly braces} is filled in by the site — keep the {word} exactly as it is.
#
# Page layout:
#   1. the latest annual report, shown large, with a "See all editions" button that filters the
#      library below to annual reports (only when there is a row of the type in `featuredType`);
#   2. the library: every TIDE publication (annual reports included) as cards, with a search box
#      and Type / Year filters (as on the THRIvE page), 12 per page. The filters only narrow this
#      list — the large card above stays in place. Every filter and count comes from the Sheet —
#      nothing to update here when a new type or year appears.
# (The numbers are in src/config/publications.js.)

meta:
  # Last crumb in the SEO breadcrumb trail (Home > About Us > this page)
  breadcrumbName: "TIDE Publications"
  badge: "About Us · Publications"
  title: "TIDE Publications"
  subtitle: "Our reports, research and talks — an open, year-by-year record of TIDE Foundation's work in education."
  seoTitle: "Publications — TIDE Foundation"
  seoDescription: "Read TIDE Foundation's annual reports, project reports, presentations and public talks."
  # Shown while no TIDE publication has been published yet
  emptyTitle: "No publications published yet"
  emptyHint: "Publications appear here as soon as they are added."

# Short line of figures under the title, counted from the Sheet.
stats:
  publicationSingular: "{n} publication"
  publicationPlural: "{n} publications"
  typeSingular: "{n} type"
  typePlural: "{n} types"
  since: "since {year}"

# Which "Type of material" (exactly as written in the Sheet; case does not matter) gets the
# large "latest" card and its "See all" button.
featuredType: "Annual report"

featured:
  eyebrow: "Latest edition"
  read: "Read report"
  # Shows the library below filtered to this type. {n} = how many there are (hidden when only 1)
  seeAllTemplate: "See all {n} editions"

# Every TIDE publication, as one filterable list of cards
library:
  heading: "All publications"
  intro: "Everything TIDE has published, newest first — search it, or narrow it by type and year."
  open: "Open"

# Search box and filters above the library (the same bar as on the THRIvE page). The lists of
# types and years come from the Sheet, with counts.
toolbar:
  searchPlaceholder: "Search titles, descriptions, types…"
  searchLabel: "Search TIDE publications"
  clearSearchLabel: "Clear search"
  # The key that jumps to the search box
  searchShortcutKey: "/"
  typeLabel: "Type of material"
  allTypes: "All types"
  yearLabel: "Year"
  allYears: "All years"
  newest: "Newest first"
  oldest: "Oldest first"
  directionLabelTemplate: "Order by date: {dir}. Click to reverse."
  clearAll: "Clear all"
  # The removable chip for the words searched; {q} = those words
  searchChipTemplate: "“{q}”"
  removeTemplate: "Remove filter: {name}"

# The count line above the library, and what it says when nothing matches
results:
  publicationSingular: "publication"
  publicationPlural: "publications"
  countTemplate: "{total} {publications}"
  # When the results take more than one page
  rangeTemplate: "Showing {from}–{to} of {total} {publications}"
  noResults: "No publications match your search or filters"
  noResultsHint: "Try a different word, or clear the filters."
  # Year-filter label for rows without a date
  undatedHeading: "Undated"

# Shown next to rows dated within the last 120 days (src/config/publications.js NEW_BADGE_DAYS)
newBadge: "New"

# Numbered pages (only shown when a list has more than one page)
pagination:
  label: "Pages"
  previous: "Previous"
  next: "Next"
  pageLabelTemplate: "Page {n}"

# Screen-reader text
a11y:
  openLabelTemplate: "{action}: {title} (opens in a new tab)"
  dateLabel: "Date"
  typeLabel: "Type of material"
  # Read after the "New" badge; {days} = NEW_BADGE_DAYS
  newLabelTemplate: "dated within the last {days} days"
