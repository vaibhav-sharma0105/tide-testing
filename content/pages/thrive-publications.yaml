# THRIvE Publications — /thrive/publications
# The publications themselves come from the "TIDE THRIvE Publications" Sheet (rows answered
# "THRIvE"), via the sync into src/data/sheets/publications.json. Only the text around them lives
# here. The TIDE page (/about/publications) is in about-publications.yaml.
# Text in {curly braces} is filled in by the site — keep the {word} exactly as it is.
#
# Page layout: a "publications per year" chart in the banner (each bar filters by that year),
# then one reading column grouped by year (newest first), 20 per page, with search, type,
# field-of-work and year filters and a newest/oldest switch above it.

meta:
  # Last crumb in the SEO breadcrumb trail (Home > THRIvE Research Centre > this page)
  breadcrumbName: "THRIvE Publications"
  badge: "THRIvE Research Centre · Publications"
  title: "THRIvE Publications"
  subtitle: "Journal articles, books, talks and coverage of our research on holistic education, social emotional learning, teacher agency and inclusive education."
  seoTitle: "THRIvE Publications — TIDE Foundation"
  seoDescription: "Research from TIDE Foundation's THRIvE Research Centre: journal articles, books and talks on holistic education, social emotional learning, teacher agency and inclusive education."
  # Shown while no THRIvE publication has been published yet
  emptyTitle: "No publications published yet"
  emptyHint: "Publications appear here as soon as they are added."

# Short line of figures under the title, counted from the Sheet.
stats:
  publicationSingular: "{n} publication"
  publicationPlural: "{n} publications"
  typeSingular: "{n} type"
  typePlural: "{n} types"
  since: "since {year}"
  # Counted from rows whose "Type of material" is one of `socialProofTypes` (hidden when 0)
  socialProofTemplate: "{n} pieces by others citing or featuring our work"
  socialProofSingular: "{n} piece by others citing or featuring our work"

# Types counted by `stats.socialProofTemplate` (exactly as written in the Sheet; case ignored)
socialProofTypes:
  - "Published by others (TIDE acknowledged)"
  - "Mass media coverage"

# "Publications per year" chart in the banner
chart:
  title: "Publications per year"
  hint: "Select a year to show only its publications."
  # Screen readers and the hover label. {year}, {n}, {publications}
  barLabelTemplate: "{year}: {n} {publications}"
  # Added to a bar's screen-reader label
  filterAction: "Show only this year"

toolbar:
  searchPlaceholder: "Search titles, authors, topics…"
  searchLabel: "Search publications"
  clearSearchLabel: "Clear search"
  # The key that jumps to the search box
  searchShortcutKey: "/"
  typeLabel: "Type of material"
  allTypes: "All types"
  fieldLabel: "Field of work"
  allFields: "All fields"
  yearLabel: "Year"
  allYears: "All years"
  # Each choice in the two lists, e.g. "Book (9)"
  optionTemplate: "{name} ({n})"
  newest: "Newest first"
  oldest: "Oldest first"
  directionLabelTemplate: "Order by date: {dir}. Click to reverse."
  clearAll: "Clear all"
  removeTemplate: "Remove filter: {name}"

results:
  publicationSingular: "publication"
  publicationPlural: "publications"
  countTemplate: "{total} {publications}"
  # When the results take more than one page
  rangeTemplate: "Showing {from}–{to} of {total} {publications}"
  noResults: "No publications match your search or filters"
  noResultsHint: "Try a different word, or clear the filters."
  # Heading for rows without a date (listed last)
  undatedHeading: "Undated"
  # After a year heading when that year started on the previous page
  continuedLabel: "continued"

# Numbered pages (only shown when the results take more than one page)
pagination:
  label: "Pages"
  previous: "Previous"
  next: "Next"
  pageLabelTemplate: "Page {n}"

# Shown next to rows dated in the last few weeks (src/config/publications.js NEW_BADGE_DAYS)
newBadge: "New"

# Where a link leads, read from its web address
source:
  label: "Source"
  doi: "DOI"
  driveFile: "Google Drive"
  driveFolder: "Google Drive folder"

entry:
  read: "Read"
  copyCitation: "Copy citation"
  copied: "Copied"
  copyFailed: "Copy failed — select the citation instead"
  # Announced by screen readers after copying
  copiedAnnouncement: "Citation copied to the clipboard"
  showMore: "Show more"
  showLess: "Show less"

# Screen-reader text
a11y:
  newTab: "(opens in a new tab)"
  openLabelTemplate: "{action}: {title} (opens in a new tab)"
  copyLabelTemplate: "Copy citation for {title}"
  citationLabel: "Citation"
  fieldsLabel: "Field of work"
  typeLabel: "Type of material"
  dateLabel: "Date"
  newLabelTemplate: "dated within the last {days} days"
