mission:
  sectionBadge: "Our Mission"
  title: "Transformative education for harmony"
  body: "TIDE builds and empowers systems to bring about holistic education of the whole child (education of the head, heart, hands, and soul) for all."
  quote: "We imagine an education that helps students develop as a whole person and learn to work together to counter the many 21st century challenges that India and the globe faces."
  learnMore: "Learn why we do this"
  learnMoreHref: "/about/why-tide"
  image1: "/assets/images/home/why-tide.jpg"
  image1Alt: "TIDE Foundation students learning in a classroom"
  image2: "/assets/images/home/join-us.jpg"
  image2Alt: "Community members joining TIDE's mission"

journey:
  sectionBadge: "Our Journey"
  intro: "A multi-year journey to developing grounded and contextualized but scalable educational interventions."
  phases:
