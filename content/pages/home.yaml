      period: "2014 to 2019"
      lives: "15,301 lives impacted"
      desc: "Understanding the educational landscape through deep transformation."
    - phase: "Phase 2"
      period: "2019 to 2026"
      lives: "37,199 lives transformed"
      desc: "Systems-based interventions to identify and develop scalable solutions."
    - phase: "Phase 3"
      period: "2026 to 2031"
      lives: "10,00,000 lives targeted"
      desc: "Scaling solutions by partnering with NGOs, schools, colleges, and governments."

