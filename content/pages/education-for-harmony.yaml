meta:
  breadcrumbName: "Education for Harmony"
  badge: "Education for Harmony"
  title: "Education for Harmony"
  tagline: "An ecosystem of interventions for self- and social-transformation."
  seoTitle: "Education for Harmony — TIDE Foundation"
  seoDescription: "TIDE Foundation's Education for Harmony programs: an ecosystem of educational interventions for self- and social-transformation, built on the CARES framework."

# Two panels. The left panel sits on a photo; the four highlighted words are underlined in the lead.
intro:
  image: "/assets/images/home/bg-contact-strip.jpg"
  paragraphs:
    - "At TIDE Foundation we have been developing an ecosystem of educational interventions for self- and social-transformation for different contexts, age groups, and to varying degrees of depth."
    - "Education for Harmony aims to nurture ways of living and being that enable individuals and communities to live in greater harmony with oneself, with others, and the world (including the more than human world) through a deepening of awareness and understanding of interconnectedness, meaningful and empathetic relationships, sense of kinship and sense of responsibility, thoughtful and compassionate action, and wisdom-based approaches of life."
  lead: "Education for harmony brings about conscientization, care, compassion, and consciousness. We specifically aim to"
  leadHighlights: ["conscientization", "care", "compassion", "consciousness"]
  aims:
    - "Foster integral (holistic) development of the child by nurturing the head, heart, hands and soul as an interconnected whole through experiential and project-based learning."
    - "Cultivate harmonious relationships grounded in a sense of care, empathy, dialogue, and appreciation of diversity."
    - "Nurture wisdom-based ways of knowing, living and being by developing an understanding of the interconnectedness of self, society, and more than human world."
    - "Empower individuals to engage in compassionate action within one's lives, homes, schools, communities and the more than human world."
    - "Promote consciousness-centred education incorporating reflection, awareness, and action."
    - "Support educational systems, leaders, and practitioners to bring about holistic education."

# EHSA / CARES: the five dimensions beside the framework figure.
cares:
  title: "Education for Harmony through Self & Social Action (EHSA)"
  acronym: "CARES"
  image: "/assets/images/education-for-harmony/cares-framework.png"
  imageAlt: "The CARES framework: Compassion & Empathy, Awareness & Consciousness, Reflect & Reimagine, Engage & Empower and Sense of Responsibility overlap inside Self, which sits within School & Home, Community, City and Planet."
  dimensions:
    - key: "C"
      name: "Compassion & Empathy"
      desc: "Developing a deep empathetic and caring connection with the issue and the various actors impacted."
    - key: "A"
      name: "Awareness & Consciousness"
      desc: "Seeing, awareness, and a deep understanding of various social, cultural, ecological issues; along that of interconnectedness."
    - key: "R"
      name: "Reflect & Reimagine"
      desc: "Deep reflection on one's own ways of living and being, systemic nature of issues, along with reimagining different possibilities."
    - key: "E"
      name: "Engage & Empower"
      desc: "Act to bring about a real and meaningful change while mobilizing and empowering others to join in."
    - key: "S"
      name: "Sense of responsibility"
      desc: "Develop an intrinsic sense of responsibility and systemic transformation."

# Each item: a number (stat), what it counts (statLabel), and one primary button (cta) plus optional quiet links (links).
# A button or link whose href/to is empty is not shown.
ecosystem:
  title: "An ecosystem of interventions"
  items:
    - name: "Exposure and deliberator events"
      desc: "Model City Councils and Parivartan Melas bring about intra-, and inter-school dialogues events that support students in exploring contextual realities in their own cities and communities."
      stat: "2,882"
      statLabel: "students"
      cta:
        label: "Find out more"
        to: "/education-for-harmony/mccx"
    - name: "Workshops and camps"
      desc: "Workshops introduce students to self- and social-transformation whereas Disha camps are action-oriented series of interventions that mobilizes students to take collective action at the individual, school, peer, community, and systems-level."
      stat: "6,206"
      statLabel: "students across 86 schools indirectly impacting 2,944 students"
      cta:
        label: "Find out more"
        href: "https://drive.google.com/file/d/1rRehfkofdNLaZHnA95I1C9L4QiUGd60m/view?usp=sharing"
      links:
        - label: "See a video overview"
          href: "#glimpses"
    - name: "Social Changemakers"
      desc: "Students engage in longer fellowships to resolve deeply interconnected issues systemically and meaningfully."
      stat: "39"
      statLabel: "students indirectly impacting 2,399 people"
      cta:
        label: "Read more about the students' initiatives"
        # TODO(owner): link out to the student profiles (auto-updated from the form). Empty = button hidden.
        href: ""
    - name: "Educator co-inquirer and transformation"
      desc: "We engage educators in deep inquiry on the philosophy, processes, pedagogies, and systems of education and engage them in a year-long diploma or a series of micro-videos."
      stat: "889"
      statLabel: "educators"
      cta:
        label: "Find out more about the Diploma program"
        href: "https://drive.google.com/file/d/1tFlU6pbxyn6PjoopXPvfnylYiJ6Ujevc/view?usp=sharing"
      links:
        - label: "Find out more about the Ecobuddy program for eco-club educators and nature educators"
          href: "https://drive.google.com/file/d/1fR9y4x52Wa7rTscdlg6Bz9erU6JdCX4s/view?usp=sharing"
    - name: "Systems transformation"
      desc: "We are currently developing the initiative which will involve in-depth audits, professional development and toolkits."

