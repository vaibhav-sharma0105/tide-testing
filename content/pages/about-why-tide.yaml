meta:
  breadcrumbName: "Why TIDE?"
  badge: "About TIDE"
  title: "Why TIDE?"
  subtitle: "We exist to create change that outlasts us."
  seoTitle: "Why TIDE? — TIDE Foundation"
  seoDescription: "TIDE Foundation was established in 2014 to bring contextualized, sustainable change to India's education sector."

whoWeAre:
  sectionTitle: "Our Mission"
  mission: "TIDE (Together in Development and Education) Foundation was established on November 14, 2014 with a singular mission: to bring about contextualized, systemic, sustainable changes in India's education sector. We believe simple, well-aimed interventions can create domino effects throughout communities."

vision:
  title: "Our Vision"
  body: "We envision an education system that propels students to think, respect other people and their perspectives, to learn to collaborate, and to deal with the many 21st century issues."
  policy: "National Education Policy 2020 calls for holistic education that can develop values including diversity, pluralism, equality and justice. Drawing on it we envision a pedagogical transformation relying on holistic, experiential, inquiry-based, multidisciplinary and learner-centred approaches to learning."
  quote: "A sustainable change requires a deep understanding of the complex system."
  backgroundImage: "/assets/images/home/bg-aim.jpg"

goals:
  sectionTitle: "Four goals"
  items:
    - iconKey: "Heart"
      text: "Build holistic learning — heart, head, hands, and soul"
    - iconKey: "Lightbulb"
      text: "Create leaders equipped with creative and critical thinking"
    - iconKey: "Target"
      text: "Develop replicable, sustainable change models"
    - iconKey: "GraduationCap"
      text: "Empower teachers to transform teaching pedagogy"

principles:
  sectionTitle: "Five guiding principles"
  items:
    - title: "Sustainable change"
      text: "Have an exit strategy where the change lasts after we leave."
      image: "/assets/images/projects-bettered/gallery-07.jpg"
    - title: "Empowering existent systems"
      text: "Work with existent systems to bring about quality education for all."
      image: "/assets/images/get-involved-volunteer/gallery-07.jpg"
    - title: "Systemic change"
      text: "Use a systems-based approach to identify and leverage key levers of change."
      image: "/assets/images/projects-bettered/gallery-04.jpg"
    - title: "Scalable change"
      text: "Develop replicable models (and while we may not scale, others should be able to do so)."
      image: "/assets/images/projects-mcc/mccx-2025-au.jpg"
    - title: "Meaningful change"
      text: "Create a deep and meaningful impact (especially on the intangibles)."
      image: "/assets/images/home/bg-counter.jpg"
