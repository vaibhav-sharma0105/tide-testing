meta:
  badge: "CompletEd · SDG Drives"
  title: "SDG Drives"
  tagline: "A year-long volunteering initiative aligned with the UN Sustainable Development Goals."
  seoTitle: "SDG Drives — TIDE Foundation"
  seoDescription: "SDG Drives is a year-long volunteer initiative by TIDE Foundation, covering 9 SDGs over 9 months through campus ambassadors, school reps, and independent volunteers."

overview:
  title: "Overview of Sustainable Development Goals"
  body: "The United Nations adopted 17 Sustainable Development Goals in 2015 as part of the 2030 Agenda for Sustainable Development. These goals address poverty, hunger, health, education, gender equality, clean water and sanitation, affordable and clean energy, economic growth, industry innovation, reduced inequalities, sustainable cities, responsible consumption, climate action, life below water, life on land, peace, justice and strong institutions, and global partnerships for development."
  image: "/assets/images/projects-sdg-drives/un-sdg-goals.png"
  imageAlt: "UN Sustainable Development Goals — 17 Goals to Transform Our World"

idea:
  title: "The Idea"
  body: "SDG Drives is a year-long volunteer initiative that covers 9 SDGs over 9 months, with two drives run every month. The program engages schools, colleges, and corporations to take meaningful action on the Sustainable Development Goals through structured, community-led activities."
  sdgList: "SDG 3 (Good Health & Well-being) · SDG 4 (Quality Education) · SDG 5 (Gender Equality) · SDG 6 (Clean Water & Sanitation) · SDG 7 (Affordable & Clean Energy) · SDG 11 (Sustainable Cities) · SDG 12 (Responsible Consumption) · SDG 13 (Climate Action) · SDG 15 (Life on Land)"
  contactNote: "Schools, colleges and corporations can participate by reaching us at info@tideinternational.org"

objectives:
  sectionBadge: "Our Objectives"
  sectionTitle: "What We Aim to Achieve"
  items:
    - title: "Spreading Awareness"
      desc: "Educating participants and communities about the 17 UN Sustainable Development Goals and their relevance to everyday life."
      iconKey: "Globe"
    - title: "Leadership in Students"
      desc: "Cultivating a generation of young leaders who take initiative in solving real-world social and environmental challenges."
      iconKey: "Users"
    - title: "Social Responsibility"
      desc: "Instilling a deep sense of duty towards communities and the environment in every participant."
      iconKey: "Heart"
    - title: "Fundamental Duties"
      desc: "Encouraging an inclination towards the fundamental duties of citizens as enshrined in the Indian Constitution."
      iconKey: "BookOpen"
    - title: "Empathy"
      desc: "Building the capacity to understand and share the feelings of others across different social and economic backgrounds."
      iconKey: "Lightbulb"

