# Byline shown under "TIDE Foundation" in the footer
tagline: "Improving access to holistic education since 2014."
# {year} is replaced with the current year in the visitor's browser, so it never goes stale
rights: "© {year} TIDE Foundation. All rights reserved."
madeWithLove: "Made with love for education in India"
# Footer Donate button (the email and phone beside it come from contact.yaml)
donateLabel: "Donate"
donateHref: "/get-involved/donate"
donateMobileLabel: "Donate to TIDE"
logo: "/assets/images/shared/tide-logo.png"
logoHref: "/"
logoAlt: "TIDE Foundation"
brandName: "TIDE"
brandSuffix: "Foundation"
# {platform} = the social link's "name" below
socialAriaLabel: "Visit TIDE on {platform}"

social:
  # platform picks the icon (facebook / instagram / linkedin); name is what screen readers hear
  - platform: "facebook"
    name: "Facebook"
    href: "https://facebook.com/togetherindevelopmentandeducation"
  - platform: "instagram"
    name: "Instagram"
    href: "https://instagram.com/tide_foundation_"
  - platform: "linkedin"
    name: "LinkedIn"
    href: "https://linkedin.com/company/13326412"
