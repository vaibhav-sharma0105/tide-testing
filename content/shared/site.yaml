# Site-wide facts used in places search engines and AI crawlers read:
# the structured data (JSON-LD) in index.html, the breadcrumb trail each page
# reports, and the llms.txt template (content/shared/llms.txt). Visible page text lives in the page's own YAML;
# the email and lives-impacted figure below must match what those pages say
# (npm run content:validate checks this).
name: "TIDE Foundation"
alternateName: "Together in Development and Education Foundation"
# The site's address for search engines: every canonical link, the breadcrumb and organisation
# structured data, sitemap.xml, robots.txt's Sitemap line and llms.txt are built from this one value.
# Write it without a trailing slash. It stays the real domain: at go-live the domain is pointed at
# this GitHub Pages site (owner decision 2026-11-25; checklist in docs/audits/2026-11-site-audit.md).
url: "https://tideinternational.org"
# false = every page tells search engines not to index it (<meta name="robots" content="noindex">),
# e.g. for a test copy of the site. true = normal.
# Staging (github.io/tide-testing): false until the domain moves (owner decision 2026-11-25).
# Set back to true on go-live day.
indexable: false
logo: "/assets/images/shared/tide-logo.png"
# Shown in place of any image that fails to load (see src/utils/imagePlaceholder.js).
placeholderImage: "/assets/images/shared/placeholder.svg"
# Faint texture behind the dark banner at the top of every inner page (PageHero).
# WebP copy of page-banner-bg.png (24 KB instead of 356 KB; it is the largest paint on inner pages).
pageBannerTexture: "/assets/images/shared/page-banner-bg.webp"
email: "tidefoundation@gmail.com"
livesImpacted: "52,500+"
# Grades the Pramaan library covers. Write {gradeRange} wherever a page says it (the YAML→JSON
# sync and llms.txt fill it in). Keep it equal to the numbered grades in LIBRARY_GRADES
# (src/utils/libraryFilters.js) — a unit test checks that.
gradeRange: "1–5"
foundingYear: "2014"
location: "Ahmedabad, Gujarat, India"
country: "India"
language: "en"
description: "TIDE Foundation is an NGO based in Ahmedabad, India working to bring sustainable, systemic change to India's education landscape since {foundingYear}. We have impacted {livesImpacted} lives across Gujarat."
websiteDescription: "Official website of TIDE Foundation — Together in Development and Education"
keywords: "education NGO India, activity-based learning, holistic education, Gujarat education, TIDE Foundation"

# robots.txt is built from this list (scripts/siteDataPlugin.js). Every crawler may read every page;
# the named groups only matter if one is ever turned off.
crawlers:
  # Search engines and AI answer engines that fetch pages to show, link or cite them.
  search: ["Googlebot", "Bingbot", "Applebot", "DuckDuckBot", "OAI-SearchBot", "ChatGPT-User", "Claude-SearchBot", "Claude-User", "PerplexityBot", "Perplexity-User"]
  # Crawlers that collect pages to train AI models. allowTraining: false asks them to stay away
  # (owner decision 2026-11-26: always off; search / answer engines stay allowed once the site is live).
  # While indexable is false (staging) robots.txt shuts out every crawler, search ones included.
  training: ["GPTBot", "ClaudeBot", "anthropic-ai", "Google-Extended", "Applebot-Extended", "CCBot", "Bytespider", "cohere-ai", "meta-externalagent"]
  allowTraining: false
  # Paths every crawler is asked to stay off, even once live (owner decision 2026-11-27: the Social
  # Changemakers profiles are students; the page is also noindex).
  private: ["/education-for-harmony/social-changemakers"]

# Names of the parent steps in each page's breadcrumb trail (the last step is
# the page's own `meta.breadcrumbName` in its YAML).
breadcrumbs:
  home: "Home"
  aboutUs: "About Us"
  getInvolved: "Get Involved"
  pramaan: "Pramaan"
  educationForHarmony: "Education for Harmony"
  resourceCentre: "Resource Centre"
  thrive: "THRIvE Research Centre"
