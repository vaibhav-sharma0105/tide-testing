# Keeps the GitHub Actions used by the workflows up to date. The workflows pin each action to an
# exact commit (e.g. actions/checkout@<sha> # v6.1.0) so a moved or hijacked tag cannot change what
# runs; Dependabot opens a pull request when a newer version is released. Review and merge it like
# any change (a major version, e.g. v6 → v7, may need a look at the action's release notes).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # npm packages (package.json / package-lock.json). Security fixes are what matters most: sharp
  # decodes Form uploads in the sync workflows, so its image-library fixes should land quickly.
  # A new version is proposed only after it has been public for 7 days (a hijacked release is
  # usually caught and pulled within that time). Production and development packages come as two
  # grouped pull requests. No workflow runs on pull requests (deploy.yml runs on main only), so check
  # the branch out and run lint, content:validate, test, build and test:e2e before merging.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
