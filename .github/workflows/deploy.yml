name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job can only read the repo; the two deploy permissions are granted to the
# deploy job alone (the build job runs npm install scripts and never needs them).
permissions:
  contents: read

# Never cancel a deploy mid-flight; queued runs wait. Every run builds the newest main (see
# Checkout), so the last one to finish always publishes the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runners are pinned to an explicit Ubuntu release (not ubuntu-latest) so a GitHub-side
  # image change cannot alter the build unannounced. Bump deliberately, and in both workflows.
  build:
    runs-on: ubuntu-24.04
    steps:
      # Always the newest main — so "Re-run" of an old run, or a deploy started by the sync, can
      # never republish an older commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The build job never pushes: no token is left in .git/config for npm install scripts to read.
          persist-credentials: false
          # Full history: sitemap.xml's <lastmod> is each page's last commit date (a shallow clone
          # would date every page "today", so the build would leave <lastmod> out instead).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate

      - name: Unit tests
        run: npm test

      # The build opens every page in headless Chromium and saves it as real HTML (scripts/prerender.mjs),
      # so crawlers that don't run JavaScript see each page's text, title and links. Playwright is a dev
      # dependency already; this downloads its browser (no secrets involved). The browser is cached per
      # Playwright version (package-lock.json); `install --with-deps` still adds the system libraries.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the prerender browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      # Every link, image and sitemap entry of the built site resolves to a file, and the JavaScript
      # stays within its size budget (scripts/check-dist.mjs).
      - name: Check the built site
        run: npm run check:dist

      # The shipped site (prerendered pages, CSP, /tide-testing/ base) in Chromium, served like GitHub
      # Pages (scripts/serve-pages.mjs): routes, menus, listings, dialogs, a11y, the must-pass screen
      # sizes. No network, no secrets. Firefox, WebKit and every screen size run nightly (e2e-nightly.yml).
      - name: End-to-end tests (built site)
        run: npm run test:e2e:site

      - name: Keep the e2e report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report-site/
            test-results-site/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells the owner when the site failed to build/deploy (a GitHub Issue assigned to
  # vars.ALERT_ASSIGNEE emails them, whoever started the run), and closes it on the next success.
  notify:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Alert the owner
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          printf 'The website build or deploy failed (build: %s, deploy: %s). The live site keeps showing the previous version.\n' "${{ needs.build.result }}" "${{ needs.deploy.result }}" > "${{ runner.temp }}/deploy.md"
          bash scripts/ci/alert-issue.sh open automation-alert "Website deploy failed" "${{ runner.temp }}/deploy.md"
      - name: Close the alert
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        run: bash scripts/ci/alert-issue.sh close automation-alert "Website deploy failed"
