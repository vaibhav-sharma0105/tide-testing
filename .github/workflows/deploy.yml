name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job can only read the repo; the two deploy permissions are granted to the
# deploy job alone (the build job runs npm install scripts and never needs them).
permissions:
  contents: read

# Never cancel a deploy mid-flight; queued runs wait. Every run builds the newest main (see
# Checkout), so the last one to finish always publishes the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runners are pinned to an explicit Ubuntu release (not ubuntu-latest) so a GitHub-side
  # image change cannot alter the build unannounced. Bump deliberately, and in both workflows.
  build:
    runs-on: ubuntu-24.04
    steps:
      # Always the newest main — so "Re-run" of an old run, or a deploy started by the sync, can
      # never republish an older commit.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          # Full history: sitemap.xml's <lastmod> is each page's last commit date (a shallow clone
          # would date every page "today", so the build would leave <lastmod> out instead).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate

      - name: Unit tests
        run: npm test

      # The build opens every page in headless Chromium and saves it as real HTML (scripts/prerender.mjs),
      # so crawlers that don't run JavaScript see each page's text, title and links. Playwright is a dev
      # dependency already; this downloads its browser (no secrets involved).
      - name: Install the prerender browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells the owner when the site failed to build/deploy (a GitHub Issue assigned to
  # vars.ALERT_ASSIGNEE emails them, whoever started the run), and closes it on the next success.
  notify:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          sparse-checkout: scripts/ci
      - name: Alert the owner
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          printf 'The website build or deploy failed (build: %s, deploy: %s). The live site keeps showing the previous version.\n' "${{ needs.build.result }}" "${{ needs.deploy.result }}" > "${{ runner.temp }}/deploy.md"
          bash scripts/ci/alert-issue.sh open automation-alert "Website deploy failed" "${{ runner.temp }}/deploy.md"
      - name: Close the alert
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        run: bash scripts/ci/alert-issue.sh close automation-alert "Website deploy failed"
