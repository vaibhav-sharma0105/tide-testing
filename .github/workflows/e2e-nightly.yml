name: Nightly end-to-end tests

# The full browser matrix on the built site (audit P6): Chromium, Firefox and WebKit, every screen
# size of the responsive matrix (@matrix), the a11y scan. deploy.yml runs only the fast Chromium set
# before each deploy. Nothing here deploys or writes to the repo; no secrets are used.
on:
  schedule:
    - cron: '41 2 * * *' # 02:41 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    # Same pinned runner and Node as deploy.yml; bump both deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Check the built site
        run: npm run check:dist

      - name: End-to-end tests, all browsers and screen sizes
        run: npm run test:e2e:full

      - name: Keep the e2e report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nightly-report
          path: |
            playwright-report-site/
            test-results-site/
          retention-days: 14
          if-no-files-found: ignore

  # Opens a GitHub Issue (assigned to vars.ALERT_ASSIGNEE) when the nightly run fails, closes it on
  # the next success. The live site is not affected either way.
  notify:
    needs: e2e
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Alert the owner
        if: needs.e2e.result == 'failure'
        run: |
          printf 'The nightly end-to-end tests failed (Chromium, Firefox, WebKit, all screen sizes). The live site is unchanged. Open the run, download the e2e-nightly-report artifact and open its traces.\n' > "${{ runner.temp }}/e2e.md"
          bash scripts/ci/alert-issue.sh update automation-alert "Nightly end-to-end tests failed" "${{ runner.temp }}/e2e.md"
      - name: Close the alert
        if: needs.e2e.result == 'success'
        run: bash scripts/ci/alert-issue.sh close automation-alert "Nightly end-to-end tests failed"
