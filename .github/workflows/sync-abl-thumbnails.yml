name: Sync ABL Thumbnails

# Keeps ABL Resource Center thumbnails self-hosted instead of depending on
# Google's undocumented thumbnail CDN at runtime. See
# docs/ABL-THUMBNAIL-SYNC-SETUP-GUIDE.md for the full setup procedure.
#
# Triggers:
#   - repository_dispatch (abl-content-changed): fired by the Apps Script
#     onSheetChange trigger within seconds of a real sheet edit.
#   - schedule: daily safety net in case a dispatch is ever missed.
#   - workflow_dispatch: manual run (e.g. the very first sync, or debugging).

on:
  repository_dispatch:
    types: [abl-content-changed]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # lets the last step start the deploy workflow (see below)

concurrency:
  group: sync-abl-thumbnails
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        id: sync
        run: npm run content:sync-abl-thumbnails
        env:
          VITE_ABL_API_URL: ${{ secrets.VITE_ABL_API_URL }}
          ABL_SYNC_TOKEN: ${{ secrets.ABL_SYNC_TOKEN }}

      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/abl src/data/abl-thumbnails-manifest.json
          git commit -m "chore(abl-sync): update resource thumbnails"
          git push

      # A push made with the default GITHUB_TOKEN does not start other workflows
      # (GitHub rule; confirmed: the 2026-06-20 sync commits started no run). Without
      # this step the new thumbnails would stay out of the live site until the next
      # manual push. Dispatching a workflow is the one thing GITHUB_TOKEN may trigger.
      - name: Deploy the updated thumbnails
        if: steps.sync.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub switches off scheduled workflows in a public repository after 60 days
      # without repository activity (the daily run above then stops silently; it did
      # after 2026-06-22). If the newest commit is 45+ days old, add one empty commit so
      # the repository counts as active. It changes no files, and a push made with
      # GITHUB_TOKEN starts no other workflow, so it does not redeploy the site.
      # Only on the scheduled run: manual and Sheet-triggered runs are activity already.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active (no commits for ${age_days} days)"
            git push
          fi
